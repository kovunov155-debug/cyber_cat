<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Cyber Cat Flyer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  background: #060814;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  font-family: system-ui, -apple-system, Arial, sans-serif;
  color: #f8fafc;
}
#gameCanvas {
  display: block;
  width: 100vw;
  height: 100vh;
  background: #060814;
}
#ui {
  position: absolute;
  top: 14px;
  left: 16px;
  font-size: 18px;
  line-height: 1.45;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
  z-index: 10;
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}
#score { font-size: 24px; font-weight: 700; color: #fff; }
#highScore { font-size: 15px; color: #67e8f9; font-weight: 600; }
#lives { color: #f472b6; margin-top: 2px; }
#shield { color: #22d3ee; display: none; font-size: 14px; font-weight: 700; margin-top: 2px; }
#startScreen, #gameOverScreen, #pauseScreen {
  position: absolute;
  inset: 0;
  background: rgba(6, 8, 20, 0.85);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 20;
  text-align: center;
  padding: 20px;
}
.panel {
  width: 100%;
  max-width: 380px;
  background: rgba(15, 23, 42, 0.96);
  border: 1px solid rgba(51, 65, 85, 0.9);
  border-radius: 18px;
  padding: 28px 24px;
  box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
}
h1 { font-size: 32px; font-weight: 800; color: #fff; margin-bottom: 12px; }
p { margin: 10px 0; font-size: 15px; line-height: 1.5; color: #cbd5e1; }
button {
  width: 100%;
  padding: 14px 28px;
  font-size: 18px;
  background: #22d3ee;
  border: none;
  border-radius: 12px;
  color: #060814;
  font-weight: 700;
  cursor: pointer;
  margin-top: 16px;
}
button:hover { background: #67e8f9; }
button:active { transform: scale(0.98); }
.score { font-size: 22px; font-weight: 700; margin: 8px 0; font-variant-numeric: tabular-nums; }
#pauseBtn {
  position: absolute;
  top: 14px;
  right: 16px;
  width: auto;
  margin: 0;
  z-index: 15;
  padding: 10px 16px;
  font-size: 14px;
  background: rgba(15, 23, 42, 0.88);
  color: #f8fafc;
  border: 1px solid rgba(71, 85, 105, 0.8);
  pointer-events: auto;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div id="score">Счёт: 0</div>
  <div id="highScore">Рекорд: 0</div>
  <div id="lives">❤❤❤</div>
  <div id="shield">ЩИТ</div>
</div>
<button id="pauseBtn" style="display:none;">Пауза</button>

<div id="startScreen">
  <div class="panel">
    <h1>Cyber Cat Flyer</h1>
    <p>Тапай, кликай или жми Пробел, чтобы взлетать.<br>Собирай звёзды (+10), избегай астероидов и лови энергощит.</p>
    <button id="startBtn">Старт</button>
  </div>
</div>

<div id="gameOverScreen" style="display:none;">
  <div class="panel">
    <h1>Полёт окончен</h1>
    <div class="score" id="finalScore">Счёт: 0</div>
    <div class="score" id="finalHigh" style="color:#67e8f9;">Рекорд: 0</div>
    <button id="restartBtn">Играть снова</button>
  </div>
</div>

<div id="pauseScreen" style="display:none;">
  <div class="panel">
    <h1>Пауза</h1>
    <button id="resumeBtn">Продолжить</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const livesEl = document.getElementById('lives');
const shieldEl = document.getElementById('shield');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const pauseScreen = document.getElementById('pauseScreen');
const pauseBtn = document.getElementById('pauseBtn');
const finalScoreEl = document.getElementById('finalScore');
const finalHighEl = document.getElementById('finalHigh');

let W = window.innerWidth;
let H = window.innerHeight;

function drawRoundedRect(x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.lineTo(x + w - rad, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
  ctx.lineTo(x + w, y + h - rad);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
  ctx.lineTo(x + rad, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
  ctx.lineTo(x, y + rad);
  ctx.quadraticCurveTo(x, y, x + rad, y);
  ctx.closePath();
}

let audioCtx = null;
function initAudio() {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) return;
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
}

function playSound(type) {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  if (type === 'jump') {
    osc.frequency.setValueAtTime(360, now);
    osc.frequency.exponentialRampToValueAtTime(740, now + 0.1);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    osc.start(now); osc.stop(now + 0.15);
  } else if (type === 'star') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(780, now);
    osc.frequency.exponentialRampToValueAtTime(1300, now + 0.11);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.21);
    osc.start(now); osc.stop(now + 0.22);
  } else if (type === 'hit') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.exponentialRampToValueAtTime(52, now + 0.28);
    gain.gain.setValueAtTime(0.26, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.start(now); osc.stop(now + 0.31);
  } else if (type === 'shield') {
    osc.frequency.setValueAtTime(540, now);
    osc.frequency.exponentialRampToValueAtTime(1060, now + 0.16);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
    osc.start(now); osc.stop(now + 0.27);
  }
}

const bgImg = new Image();
bgImg.failed = false;
bgImg.onerror = () => { bgImg.failed = true; };
bgImg.src = 'assets/bg.jpg';
function isBgReady() {
  return !bgImg.failed && bgImg.complete && bgImg.naturalWidth > 0;
}

let gameRunning = false;
let paused = false;
let score = 0;
let scoreAccum = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('cyberCatHigh') || '0', 10) || 0; } catch (e) {}
highScoreEl.textContent = 'Рекорд: ' + highScore;

let lives = 3;
let hasShield = false;
let shieldTimer = 0;
let invincibleTimer = 0;
let shakeTimer = 0;
let trailAccum = 0;
let difficulty = 1;
let animTime = 0;
let bgX = 0;

const cat = { x: 100, y: 200, size: 68, vy: 0, gravity: 0.42, jump: -8.6 };
let stars = [];
let asteroids = [];
let shields = [];
let particles = [];
let rings = [];
let popups = [];
let bgStars = [];
let starSpawnTimer = 0.8;
let astSpawnTimer = 1.1;
let shieldSpawnTimer = 9;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cat.size = Math.max(56, Math.min(76, Math.round(H * 0.1)));
  cat.x = Math.max(44, Math.min(220, W * 0.18));
  if (cat.y + cat.size > H) cat.y = Math.max(0, H - cat.size - 12);
}

function initBgStars() {
  bgStars = [];
  for (let i = 0; i < 95; i++) {
    const layer = i % 3;
    bgStars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: layer === 0 ? 0.8 : layer === 1 ? 1.25 : 1.7,
      alpha: layer === 0 ? 0.35 : layer === 1 ? 0.65 : 0.9,
      speed: layer === 0 ? 0.35 : layer === 1 ? 0.95 : 2.1,
      layer,
      phase: Math.random() * Math.PI * 2
    });
  }
}

function createAsteroidShape() {
  const points = [];
  for (let i = 0; i < 14; i++) {
    const angle = (i / 14) * Math.PI * 2;
    const wave = Math.sin(i * 2.3) * 0.09;
    points.push({ angle, scale: 0.8 + wave + (Math.random() - 0.5) * 0.16 });
  }
  return {
    points,
    craters: [
      { x: -0.22, y: -0.18, r: 0.2 },
      { x: 0.24, y: 0.14, r: 0.15 },
      { x: -0.05, y: 0.3, r: 0.11 }
    ],
    cracks: [
      { x1: -0.45, y1: 0.05, x2: -0.1, y2: -0.02, x3: 0.18, y3: -0.25 },
      { x1: 0.1, y1: 0.35, x2: 0.28, y2: 0.08, x3: 0.42, y3: -0.1 }
    ]
  };
}

window.addEventListener('resize', resize);
resize();
initBgStars();

function init() {
  cat.x = Math.max(44, Math.min(220, W * 0.18));
  cat.y = H / 2 - cat.size / 2;
  cat.vy = 0;
  stars = [];
  asteroids = [];
  shields = [];
  particles = [];
  rings = [];
  popups = [];
  score = 0;
  scoreAccum = 0;
  lives = 3;
  hasShield = false;
  shieldTimer = 0;
  invincibleTimer = 0;
  shakeTimer = 0;
  difficulty = 1;
  starSpawnTimer = 0.7;
  astSpawnTimer = 1.1;
  shieldSpawnTimer = 8.5;
  scoreEl.textContent = 'Счёт: 0';
  livesEl.textContent = '❤❤❤';
  shieldEl.style.display = 'none';
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 1.5 + Math.random() * 4.5;
    const maxLife = 0.4 + Math.random() * 0.35;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: maxLife,
      maxLife,
      r: 1.8 + Math.random() * 2.4,
      color
    });
  }
}

function spawnRing(x, y, maxR, color) {
  rings.push({ x, y, r: 8, maxR, life: 0.35, maxLife: 0.35, color });
}

function spawnPopup(x, y, text, color) {
  popups.push({ x, y, text, life: 0.75, maxLife: 0.75, color });
}

function circlesCollide(ax, ay, ar, bx, by, br) {
  const dx = ax - bx;
  const dy = ay - by;
  const sum = ar + br;
  return dx * dx + dy * dy < sum * sum;
}

function takeDamage() {
  lives--;
  shakeTimer = 0.24;
  livesEl.textContent = lives > 0 ? '❤'.repeat(lives) : '0';
  playSound('hit');
  spawnParticles(cat.x + cat.size / 2, cat.y + cat.size / 2, '#e879f9', 24);
  spawnRing(cat.x + cat.size / 2, cat.y + cat.size / 2, 74, '#e879f9');
  if (lives <= 0) {
    gameOver();
  } else {
    invincibleTimer = 1.8;
    cat.y = Math.max(24, H * 0.42 - cat.size / 2);
    cat.vy = -2.5;
    asteroids = asteroids.filter(a => Math.abs(a.x - cat.x) > cat.size * 2.8);
  }
}

function update(dt) {
  const step = dt * 60;
  animTime += dt;

  bgX -= (gameRunning && !paused ? 1.2 + difficulty * 0.25 : 0.45) * step;
  for (const s of bgStars) {
    s.x -= s.speed * (gameRunning && !paused ? 1 + difficulty * 0.14 : 0.45) * step;
    if (s.x < -6) {
      s.x = W + 6;
      s.y = Math.random() * H;
    }
  }

  if (!gameRunning) {
    if (!paused) {
      cat.y = H * 0.5 - cat.size / 2 + Math.sin(animTime * 2.4) * 14;
      cat.vy = Math.cos(animTime * 2.4) * 1.4;
    }
    return;
  }
  if (paused) return;

  difficulty = 1 + Math.floor(score / 200);
  cat.vy = Math.min(12.5, cat.vy + cat.gravity * step);
  cat.y += cat.vy * step;

  trailAccum += dt;
  if (trailAccum >= 0.045) {
    trailAccum = 0;
    particles.push({
      x: cat.x + cat.size * 0.12,
      y: cat.y + cat.size * 0.58 + (Math.random() - 0.5) * 6,
      vx: -(2.2 + Math.random() * 1.4),
      vy: (Math.random() - 0.5) * 0.8,
      life: 0.28,
      maxLife: 0.28,
      r: 1.8,
      color: Math.random() > 0.4 ? '#22d3ee' : '#e879f9'
    });
  }

  if (cat.y < 8) {
    cat.y = 8;
    if (cat.vy < 0) cat.vy = 0;
  }
  if (cat.y + cat.size > H - 6) {
    if (invincibleTimer > 0) {
      cat.y = H - cat.size - 16;
      cat.vy = -5;
    } else {
      takeDamage();
      if (!gameRunning) return;
    }
  }

  if (invincibleTimer > 0) invincibleTimer = Math.max(0, invincibleTimer - dt);
  if (shakeTimer > 0) shakeTimer = Math.max(0, shakeTimer - dt);

  if (hasShield) {
    shieldTimer -= dt;
    shieldEl.textContent = 'ЩИТ · ' + Math.ceil(shieldTimer) + 'с';
    if (shieldTimer <= 0) {
      hasShield = false;
      shieldEl.style.display = 'none';
    }
  }

  starSpawnTimer -= dt;
  if (starSpawnTimer <= 0) {
    stars.push({
      x: W + 48,
      y: 56 + Math.random() * Math.max(40, H - 150),
      size: 36,
      speed: 3.4 + difficulty * 0.42,
      phase: Math.random() * Math.PI * 2
    });
    starSpawnTimer = Math.max(0.65, 1.2 - difficulty * 0.06);
  }

  astSpawnTimer -= dt;
  if (astSpawnTimer <= 0) {
    const size = 54 + Math.random() * 34;
    asteroids.push({
      x: W + 64,
      y: 36 + Math.random() * Math.max(40, H - size - 72),
      size,
      speed: 4.1 + difficulty * 0.58,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 1.8,
      shape: createAsteroidShape()
    });
    astSpawnTimer = Math.max(0.68, 1.55 - difficulty * 0.09);
  }

  if (!hasShield) {
    shieldSpawnTimer -= dt;
    if (shieldSpawnTimer <= 0) {
      shields.push({
        x: W + 48,
        y: 64 + Math.random() * Math.max(40, H - 170),
        size: 40,
        speed: 3.5
      });
      shieldSpawnTimer = 10 + Math.random() * 5;
    }
  }

  const catCx = cat.x + cat.size / 2;
  const catCy = cat.y + cat.size / 2;
  const catR = cat.size * 0.31;

  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    s.x -= s.speed * step;
    if (s.x < -60) { stars.splice(i, 1); continue; }
    const sx = s.x + s.size / 2;
    const sy = s.y + s.size / 2;
    if (circlesCollide(catCx, catCy, catR + 6, sx, sy, s.size * 0.48)) {
      score += 10;
      spawnParticles(sx, sy, '#fde047', 12);
      spawnRing(sx, sy, 42, '#fbbf24');
      spawnPopup(sx, sy - 10, '+10', '#fde047');
      stars.splice(i, 1);
      scoreEl.textContent = 'Счёт: ' + score;
      playSound('star');
    }
  }

  for (let i = shields.length - 1; i >= 0; i--) {
    const sh = shields[i];
    sh.x -= sh.speed * step;
    if (sh.x < -60) { shields.splice(i, 1); continue; }
    const shX = sh.x + sh.size / 2;
    const shY = sh.y + sh.size / 2;
    if (circlesCollide(catCx, catCy, catR + 6, shX, shY, sh.size * 0.5)) {
      hasShield = true;
      shieldTimer = 10;
      shieldEl.style.display = 'block';
      shieldEl.textContent = 'ЩИТ · 10с';
      spawnParticles(shX, shY, '#22d3ee', 16);
      spawnRing(shX, shY, 54, '#22d3ee');
      spawnPopup(shX, shY - 12, 'Щит!', '#67e8f9');
      shields.splice(i, 1);
      playSound('shield');
    }
  }

  for (let i = asteroids.length - 1; i >= 0; i--) {
    const a = asteroids[i];
    a.x -= a.speed * step;
    a.rotation += a.rotSpeed * dt;
    if (a.x < -120) { asteroids.splice(i, 1); continue; }
    const ax = a.x + a.size / 2;
    const ay = a.y + a.size / 2;
    if (circlesCollide(catCx, catCy, catR, ax, ay, a.size * 0.39)) {
      if (hasShield) {
        hasShield = false;
        shieldEl.style.display = 'none';
        shakeTimer = 0.14;
        spawnParticles(ax, ay, '#22d3ee', 20);
        spawnRing(ax, ay, 66, '#22d3ee');
        asteroids.splice(i, 1);
        playSound('shield');
      } else if (invincibleTimer <= 0) {
        asteroids.splice(i, 1);
        takeDamage();
        if (!gameRunning) return;
      }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * step;
    p.y += p.vy * step;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.life -= dt;
    r.r = 8 + (r.maxR - 8) * (1 - r.life / r.maxLife);
    if (r.life <= 0) rings.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const pop = popups[i];
    pop.y -= 38 * dt;
    pop.life -= dt;
    if (pop.life <= 0) popups.splice(i, 1);
  }

  scoreAccum += dt * 7.5;
  if (scoreAccum >= 1) {
    const add = Math.floor(scoreAccum);
    scoreAccum -= add;
    score += add;
    scoreEl.textContent = 'Счёт: ' + score;
  }
}

function drawBackdrop() {
  if (isBgReady()) {
    const tileW = Math.max(W, Math.ceil((bgImg.naturalWidth / bgImg.naturalHeight) * H));
    const cycle = tileW * 2;
    const offset = ((bgX % cycle) + cycle) % cycle;
    const startX = -offset;
    for (let i = 0; i < 4; i++) {
      const drawX = startX + i * tileW;
      if (drawX > W || drawX + tileW < 0) continue;
      ctx.save();
      if (i % 2 === 1) {
        ctx.translate(drawX + tileW, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(bgImg, 0, 0, tileW + 1, H);
      } else {
        ctx.drawImage(bgImg, drawX, 0, tileW + 1, H);
      }
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(6, 8, 20, 0.28)';
    ctx.fillRect(0, 0, W, H);
  } else {
    const grad = ctx.createLinearGradient(0, 0, W * 0.4, H);
    grad.addColorStop(0, '#050712');
    grad.addColorStop(0.5, '#0b1228');
    grad.addColorStop(1, '#150d29');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    const neb1 = ctx.createRadialGradient(W * 0.72, H * 0.3, 10, W * 0.72, H * 0.3, Math.max(W, H) * 0.45);
    neb1.addColorStop(0, 'rgba(34, 211, 238, 0.12)');
    neb1.addColorStop(1, 'rgba(34, 211, 238, 0)');
    ctx.fillStyle = neb1;
    ctx.fillRect(0, 0, W, H);

    const neb2 = ctx.createRadialGradient(W * 0.28, H * 0.75, 10, W * 0.28, H * 0.75, Math.max(W, H) * 0.4);
    neb2.addColorStop(0, 'rgba(232, 121, 249, 0.1)');
    neb2.addColorStop(1, 'rgba(232, 121, 249, 0)');
    ctx.fillStyle = neb2;
    ctx.fillRect(0, 0, W, H);
  }

  for (const s of bgStars) {
    const tw = 0.72 + Math.sin(animTime * (2 + s.layer) + s.phase) * 0.28;
    const a = Math.min(1, s.alpha * tw);
    ctx.fillStyle = s.layer === 2 ? `rgba(186, 230, 253, ${a})` : `rgba(226, 232, 240, ${a})`;
    ctx.beginPath();
    if (s.layer === 2) ctx.ellipse(s.x, s.y, s.r * 1.9, s.r * 0.75, 0, 0, Math.PI * 2);
    else ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawVectorStar(s) {
  const cx = s.x + s.size / 2;
  const cy = s.y + s.size / 2;
  const pulse = 1 + Math.sin(animTime * 5 + s.phase) * 0.08;
  const outer = (s.size / 2) * pulse;
  const inner = outer * 0.44;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.sin(animTime * 2.2 + s.phase) * 0.22);

  const halo = ctx.createRadialGradient(0, 0, inner * 0.2, 0, 0, outer * 1.5);
  halo.addColorStop(0, 'rgba(253, 224, 71, 0.55)');
  halo.addColorStop(1, 'rgba(245, 158, 11, 0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(0, 0, outer * 1.5, 0, Math.PI * 2);
  ctx.fill();

  const pts = [];
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? outer : inner;
    const ang = (i * Math.PI) / 5 - Math.PI / 2;
    pts.push({ x: Math.cos(ang) * r, y: Math.sin(ang) * r });
  }
  for (let i = 0; i < 10; i++) {
    const p1 = pts[i], p2 = pts[(i + 1) % 10];
    ctx.fillStyle = i % 2 === 0 ? '#fde047' : '#f59e0b';
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.closePath();
    ctx.fill();
  }
  ctx.strokeStyle = '#fef9c3';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  pts.forEach((p, idx) => (idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
  ctx.closePath();
  ctx.stroke();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, inner * 0.25, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawVectorAsteroid(a) {
  const cx = a.x + a.size / 2;
  const cy = a.y + a.size / 2;
  const r = a.size / 2;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(a.rotation);

  const grad = ctx.createRadialGradient(-r * 0.34, -r * 0.34, r * 0.08, 0, 0, r * 1.1);
  grad.addColorStop(0, '#94a3b8');
  grad.addColorStop(0.45, '#475569');
  grad.addColorStop(0.85, '#1e293b');
  grad.addColorStop(1, '#0f172a');
  ctx.fillStyle = grad;

  ctx.beginPath();
  a.shape.points.forEach((pt, idx) => {
    const px = Math.cos(pt.angle) * r * pt.scale;
    const py = Math.sin(pt.angle) * r * pt.scale;
    if (idx === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.closePath();
  ctx.fill();

  const rim = ctx.createLinearGradient(-r, -r, r, r);
  rim.addColorStop(0, '#cbd5e1');
  rim.addColorStop(0.5, '#64748b');
  rim.addColorStop(1, '#1e293b');
  ctx.strokeStyle = rim;
  ctx.lineWidth = 1.8;
  ctx.stroke();

  ctx.strokeStyle = 'rgba(15, 23, 42, 0.7)';
  ctx.lineWidth = 1.4;
  for (const cr of a.shape.cracks) {
    ctx.beginPath();
    ctx.moveTo(cr.x1 * r, cr.y1 * r);
    ctx.lineTo(cr.x2 * r, cr.y2 * r);
    ctx.lineTo(cr.x3 * r, cr.y3 * r);
    ctx.stroke();
  }
  for (const c of a.shape.craters) {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
    ctx.beginPath();
    ctx.arc(c.x * r, c.y * r, c.r * r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(c.x * r, c.y * r, c.r * r, 0.2, Math.PI * 0.85);
    ctx.stroke();
  }
  ctx.restore();
}

function drawShieldPickup(sh) {
  const cx = sh.x + sh.size / 2;
  const cy = sh.y + sh.size / 2;
  const r = sh.size / 2;

  ctx.save();
  ctx.translate(cx, cy);

  const aura = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 1.45);
  aura.addColorStop(0, 'rgba(34, 211, 238, 0.5)');
  aura.addColorStop(1, 'rgba(34, 211, 238, 0)');
  ctx.fillStyle = aura;
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.45, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.rotate(animTime * 2.4);
  ctx.strokeStyle = '#67e8f9';
  ctx.lineWidth = 2;
  ctx.setLineDash([7, 5]);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.94, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.rotate(-animTime * 1.8);
  ctx.strokeStyle = 'rgba(232, 121, 249, 0.75)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.74, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  const crestGrad = ctx.createLinearGradient(0, -r * 0.55, 0, r * 0.55);
  crestGrad.addColorStop(0, '#22d3ee');
  crestGrad.addColorStop(1, '#0e7490');
  ctx.fillStyle = crestGrad;
  ctx.strokeStyle = '#ecfeff';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.52);
  ctx.lineTo(r * 0.42, -r * 0.3);
  ctx.quadraticCurveTo(r * 0.4, r * 0.24, 0, r * 0.54);
  ctx.quadraticCurveTo(-r * 0.4, r * 0.24, -r * 0.42, -r * 0.3);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

function drawVectorCat() {
  if (invincibleTimer > 0 && Math.floor(animTime * 16) % 2 === 0) return;

  const s = cat.size;
  const cx = cat.x + s / 2;
  const cy = cat.y + s / 2;
  const tilt = Math.max(-0.36, Math.min(0.42, cat.vy * 0.045));

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(tilt);

  const thrustBoost = cat.vy < -1 ? 1.35 : 0.85;
  const flicker = 0.88 + Math.sin(animTime * 48) * 0.12;
  const flameLen = s * 0.44 * thrustBoost * flicker;

  const outerFlame = ctx.createLinearGradient(-s * 0.26, 0, -s * 0.26 - flameLen, 0);
  outerFlame.addColorStop(0, 'rgba(34, 211, 238, 0.95)');
  outerFlame.addColorStop(0.55, 'rgba(232, 121, 249, 0.65)');
  outerFlame.addColorStop(1, 'rgba(232, 121, 249, 0)');
  ctx.fillStyle = outerFlame;
  ctx.beginPath();
  ctx.moveTo(-s * 0.25, -s * 0.04);
  ctx.quadraticCurveTo(-s * 0.25 - flameLen * 0.6, s * 0.02, -s * 0.25 - flameLen, s * 0.09);
  ctx.quadraticCurveTo(-s * 0.25 - flameLen * 0.55, s * 0.17, -s * 0.25, s * 0.22);
  ctx.closePath();
  ctx.fill();

  const innerFlame = ctx.createLinearGradient(-s * 0.25, 0, -s * 0.25 - flameLen * 0.58, 0);
  innerFlame.addColorStop(0, '#fff');
  innerFlame.addColorStop(0.5, '#a5f3fc');
  innerFlame.addColorStop(1, 'rgba(34, 211, 238, 0)');
  ctx.fillStyle = innerFlame;
  ctx.beginPath();
  ctx.moveTo(-s * 0.25, s * 0.02);
  ctx.lineTo(-s * 0.25 - flameLen * 0.58, s * 0.09);
  ctx.lineTo(-s * 0.25, s * 0.16);
  ctx.closePath();
  ctx.fill();

  const tailWave = Math.sin(animTime * 9) * s * 0.08;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = s * 0.095;
  ctx.beginPath();
  ctx.moveTo(-s * 0.2, s * 0.16);
  ctx.bezierCurveTo(-s * 0.42, s * 0.18 + tailWave, -s * 0.48, -s * 0.08 + tailWave, -s * 0.38, -s * 0.22 + tailWave);
  ctx.stroke();

  ctx.strokeStyle = '#c084fc';
  ctx.lineWidth = s * 0.042;
  ctx.stroke();

  ctx.fillStyle = '#22d3ee';
  ctx.beginPath();
  ctx.arc(-s * 0.38, -s * 0.22 + tailWave, s * 0.045, 0, Math.PI * 2);
  ctx.fill();

  const scarfWave = Math.sin(animTime * 14) * s * 0.05;
  const scarfGrad = ctx.createLinearGradient(-s * 0.05, 0, -s * 0.48, s * 0.05);
  scarfGrad.addColorStop(0, '#e879f9');
  scarfGrad.addColorStop(1, 'rgba(232, 121, 249, 0.15)');
  ctx.fillStyle = scarfGrad;
  ctx.beginPath();
  ctx.moveTo(-s * 0.06, -s * 0.01);
  ctx.quadraticCurveTo(-s * 0.28, -s * 0.08 + scarfWave, -s * 0.46, -s * 0.02 - scarfWave);
  ctx.quadraticCurveTo(-s * 0.3, s * 0.07 + scarfWave, -s * 0.08, s * 0.06);
  ctx.closePath();
  ctx.fill();

  const packGrad = ctx.createLinearGradient(-s * 0.32, -s * 0.08, -s * 0.14, s * 0.24);
  packGrad.addColorStop(0, '#64748b');
  packGrad.addColorStop(0.5, '#334155');
  packGrad.addColorStop(1, '#0f172a');
  ctx.fillStyle = packGrad;
  ctx.strokeStyle = '#22d3ee';
  ctx.lineWidth = 1.6;
  drawRoundedRect(-s * 0.31, -s * 0.06, s * 0.17, s * 0.31, 5);
  ctx.fill();
  ctx.stroke();

  const bodyGrad = ctx.createRadialGradient(s * 0.05, s * 0.06, s * 0.03, 0, s * 0.13, s * 0.26);
  bodyGrad.addColorStop(0, '#475569');
  bodyGrad.addColorStop(0.6, '#1e293b');
  bodyGrad.addColorStop(1, '#0f172a');
  ctx.fillStyle = bodyGrad;
  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.ellipse(0, s * 0.13, s * 0.23, s * 0.17, -0.12, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#22d3ee';
  ctx.beginPath();
  ctx.arc(s * 0.11, s * 0.14, s * 0.04, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#334155';
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 1.4;
  drawRoundedRect(s * 0.06, s * 0.2, s * 0.17, s * 0.08, 4);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#0f172a';
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(s * 0.02, -s * 0.23);
  ctx.lineTo(s * 0.17, -s * 0.41);
  ctx.lineTo(s * 0.22, -s * 0.14);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#e879f9';
  ctx.beginPath();
  ctx.moveTo(s * 0.07, -s * 0.22);
  ctx.lineTo(s * 0.15, -s * 0.34);
  ctx.lineTo(s * 0.18, -s * 0.17);
  ctx.closePath();
  ctx.fill();

  const headGrad = ctx.createRadialGradient(s * 0.06, -s * 0.16, s * 0.04, s * 0.02, -s * 0.09, s * 0.24);
  headGrad.addColorStop(0, '#475569');
  headGrad.addColorStop(0.55, '#1e293b');
  headGrad.addColorStop(1, '#090d1a');
  ctx.fillStyle = headGrad;
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(s * 0.02, -s * 0.09, s * 0.21, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#1e293b';
  ctx.strokeStyle = '#22d3ee';
  ctx.lineWidth = 1.7;
  ctx.beginPath();
  ctx.moveTo(-s * 0.15, -s * 0.13);
  ctx.lineTo(-s * 0.21, -s * 0.41);
  ctx.lineTo(-s * 0.01, -s * 0.24);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#22d3ee';
  ctx.beginPath();
  ctx.moveTo(-s * 0.13, -s * 0.17);
  ctx.lineTo(-s * 0.17, -s * 0.33);
  ctx.lineTo(-s * 0.05, -s * 0.22);
  ctx.closePath();
  ctx.fill();

  const visorGrad = ctx.createLinearGradient(-s * 0.02, -s * 0.19, s * 0.26, -s * 0.02);
  visorGrad.addColorStop(0, '#0284c7');
  visorGrad.addColorStop(0.45, '#22d3ee');
  visorGrad.addColorStop(0.85, '#67e8f9');
  visorGrad.addColorStop(1, '#e879f9');
  ctx.fillStyle = visorGrad;
  ctx.strokeStyle = '#cffafe';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(-s * 0.01, -s * 0.17);
  ctx.quadraticCurveTo(s * 0.17, -s * 0.2, s * 0.24, -s * 0.1);
  ctx.quadraticCurveTo(s * 0.23, -s * 0.01, s * 0.04, -s * 0.03);
  ctx.quadraticCurveTo(-s * 0.03, -s * 0.05, -s * 0.01, -s * 0.17);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
  ctx.beginPath();
  ctx.ellipse(s * 0.11, -s * 0.13, s * 0.075, s * 0.022, -0.15, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#f472b6';
  ctx.beginPath();
  ctx.arc(s * 0.18, -s * 0.01, 2.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  if (hasShield) {
    const pulse = 1 + Math.sin(animTime * 7) * 0.035;
    const rad = s * 0.62 * pulse;
    ctx.save();
    ctx.strokeStyle = shieldTimer < 2.5 && Math.floor(animTime * 10) % 2 === 0 ? '#f59e0b' : '#22d3ee';
    ctx.lineWidth = 2;
    ctx.fillStyle = 'rgba(34, 211, 238, 0.12)';
    ctx.beginPath();
    ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = '#cffafe';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, rad + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0, shieldTimer / 10));
    ctx.stroke();
    ctx.restore();
  }
}

function draw() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (shakeTimer > 0 && gameRunning) {
    const mag = (shakeTimer / 0.24) * 6;
    ctx.translate((Math.random() - 0.5) * mag * 2, (Math.random() - 0.5) * mag * 2);
  }

  drawBackdrop();

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const r of rings) {
    ctx.globalAlpha = Math.max(0, r.life / r.maxLife);
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (const s of stars) drawVectorStar(s);
  for (const sh of shields) drawShieldPickup(sh);
  for (const a of asteroids) drawVectorAsteroid(a);
  drawVectorCat();

  for (const pop of popups) {
    ctx.globalAlpha = Math.max(0, pop.life / pop.maxLife);
    ctx.font = '700 16px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = pop.color;
    ctx.fillText(pop.text, pop.x, pop.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

let lastTime = performance.now();
function gameLoop(now) {
  const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  initAudio();
  init();
  gameRunning = true;
  paused = false;
  startScreen.style.display = 'none';
  gameOverScreen.style.display = 'none';
  pauseScreen.style.display = 'none';
  pauseBtn.style.display = 'block';
}

function gameOver() {
  gameRunning = false;
  paused = false;
  if (score > highScore) {
    highScore = score;
    try { localStorage.setItem('cyberCatHigh', String(highScore)); } catch (e) {}
  }
  finalScoreEl.textContent = 'Счёт: ' + score;
  finalHighEl.textContent = 'Рекорд: ' + highScore;
  highScoreEl.textContent = 'Рекорд: ' + highScore;
  gameOverScreen.style.display = 'flex';
  pauseBtn.style.display = 'none';
}

function jump() {
  if (gameRunning && !paused) {
    cat.vy = cat.jump;
    spawnParticles(cat.x + cat.size * 0.14, cat.y + cat.size * 0.62, '#22d3ee', 6);
    playSound('jump');
  }
}

function togglePause() {
  if (!gameRunning) return;
  paused = !paused;
  pauseScreen.style.display = paused ? 'flex' : 'none';
}

document.getElementById('startBtn').onclick = function() { this.blur(); startGame(); };
document.getElementById('restartBtn').onclick = function() { this.blur(); startGame(); };
document.getElementById('resumeBtn').onclick = function() { this.blur(); togglePause(); };
pauseBtn.onclick = function() { this.blur(); togglePause(); };

canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); }, { passive: false });
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (!e.repeat) jump();
  }
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
});

init();
requestAnimationFrame(gameLoop);
</script>
</body>
