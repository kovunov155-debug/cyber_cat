<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Cyber Cat Flyer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  background: #000; 
  overflow: hidden; 
  touch-action: none;
  font-family: 'Arial', sans-serif;
  color: #fff;
}
#gameCanvas {
  display: block;
  width: 100vw;
  height: 100vh;
  background: #0a001a;
}
#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 18px;
  text-shadow: 0 0 5px #ff00ff;
  z-index: 10;
  pointer-events: none;
}
#lives { color: #ff55ff; }
#shield { color: #00ffff; display: none; }
#startScreen, #gameOverScreen, #pauseScreen {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,20,0.9);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 20;
  text-align: center;
  padding: 20px;
}
h1 { font-size: 36px; color: #ff00ff; text-shadow: 0 0 10px #00ffff; margin-bottom: 15px; }
p { margin: 10px 0; font-size: 16px; line-height: 1.4; }
button {
  padding: 15px 40px;
  font-size: 22px;
  background: linear-gradient(45deg, #ff00ff, #00ffff);
  border: none;
  border-radius: 10px;
  color: #000;
  font-weight: bold;
  cursor: pointer;
  margin: 10px;
}
button:active { transform: scale(0.95); }
.score { font-size: 26px; margin: 8px; }
#pauseBtn {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 15;
  padding: 8px 16px;
  font-size: 16px;
  pointer-events: auto;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div id="score">Счёт: 0</div>
  <div id="highScore">Рекорд: 0</div>
  <div id="lives">❤❤❤</div>
  <div id="shield">ЩИТ</div>
</div>
<button id="pauseBtn" style="display:none;">Пауза</button>
<div id="startScreen">
  <h1>Cyber Cat Flyer</h1>
  <p>Тапай чтобы лететь вверх!<br>Собирай звёзды (+10).<br>Избегай астероидов.<br>3 жизни. Иногда появляется щит.</p>
  <button id="startBtn">Старт</button>
</div>
<div id="gameOverScreen" style="display:none;">
  <h1>Game Over</h1>
  <div class="score" id="finalScore">Счёт: 0</div>
  <div class="score" id="finalHigh">Рекорд: 0</div>
  <button id="restartBtn">Играть снова</button>
</div>
<div id="pauseScreen" style="display:none;">
  <h1>Пауза</h1>
  <button id="resumeBtn">Продолжить</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const livesEl = document.getElementById('lives');
const shieldEl = document.getElementById('shield');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const pauseScreen = document.getElementById('pauseScreen');
const pauseBtn = document.getElementById('pauseBtn');
const finalScoreEl = document.getElementById('finalScore');
const finalHighEl = document.getElementById('finalHigh');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio (Web Audio API - no files needed)
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  if (type === 'jump') {
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
  } else if (type === 'star') {
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  } else if (type === 'hit') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'shield') {
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
  }
}

// Images
const catImg = new Image(); catImg.src = 'assets/cat.jpg';
const starImg = new Image(); starImg.src = 'assets/star.jpg';
const astImg = new Image(); astImg.src = 'assets/asteroid.jpg';
const bgImg = new Image(); bgImg.src = 'assets/bg.jpg';

let imagesLoaded = 0;
[catImg, starImg, astImg, bgImg].forEach(img => {
  img.onload = () => { imagesLoaded++; if (imagesLoaded === 4) init(); };
});

// Game state
let gameRunning = false;
let paused = false;
let score = 0;
let highScore = parseInt(localStorage.getItem('cyberCatHigh') || '0');
let lives = 3;
let hasShield = false;
let shieldTimer = 0;
highScoreEl.textContent = 'Рекорд: ' + highScore;

const cat = { x: 0, y: 0, width: 80, height: 80, vy: 0, gravity: 0.45, jump: -10 };
let stars = [];
let asteroids = [];
let particles = [];
let shields = [];
let frame = 0;
let bgX = 0;
let difficulty = 1;

function init() {
  cat.x = W * 0.2;
  cat.y = H / 2;
  cat.vy = 0;
  stars = [];
  asteroids = [];
  particles = [];
  shields = [];
  score = 0;
  frame = 0;
  lives = 3;
  hasShield = false;
  shieldTimer = 0;
  difficulty = 1;
  scoreEl.textContent = 'Счёт: 0';
  updateLivesUI();
  shieldEl.style.display = 'none';
}

function updateLivesUI() {
  livesEl.textContent = '❤'.repeat(lives);
}

function spawnStar() {
  stars.push({
    x: W + 40,
    y: Math.random() * (H - 80) + 40,
    size: 38,
    speed: 3.2 + difficulty * 0.4
  });
}

function spawnAsteroid() {
  asteroids.push({
    x: W + 40,
    y: Math.random() * (H - 100) + 30,
    size: 55 + Math.random() * 35,
    speed: 4 + difficulty * 0.6
  });
}

function spawnShield() {
  shields.push({
    x: W + 40,
    y: Math.random() * (H - 80) + 40,
    size: 40,
    speed: 3.5
  });
}

function spawnParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      life: 30 + Math.random() * 20,
      color
    });
  }
}

function update() {
  if (!gameRunning || paused) return;
  frame++;
  difficulty = 1 + Math.floor(score / 200);

  cat.vy += cat.gravity;
  cat.y += cat.vy;
  if (cat.y < 0) cat.y = 0;
  if (cat.y + cat.height > H) {
    takeDamage();
    return;
  }

  bgX -= 1.2 + difficulty * 0.3;
  if (bgX <= -W) bgX = 0;

  if (frame % Math.max(40, 70 - difficulty * 5) === 0) spawnStar();
  if (frame % Math.max(50, 100 - difficulty * 8) === 0) spawnAsteroid();
  if (frame % 400 === 0 && !hasShield) spawnShield();

  // Stars
  for (let i = stars.length - 1; i >= 0; i--) {
    stars[i].x -= stars[i].speed;
    if (stars[i].x < -50) stars.splice(i, 1);
    else if (rectsCollide(cat, stars[i])) {
      score += 10;
      spawnParticles(stars[i].x + 20, stars[i].y + 20, '#ffff00', 8);
      stars.splice(i, 1);
      scoreEl.textContent = 'Счёт: ' + score;
      playSound('star');
    }
  }

  // Asteroids
  for (let i = asteroids.length - 1; i >= 0; i--) {
    asteroids[i].x -= asteroids[i].speed;
    if (asteroids[i].x < -100) asteroids.splice(i, 1);
    else if (rectsCollide(cat, asteroids[i])) {
      if (hasShield) {
        hasShield = false;
        shieldEl.style.display = 'none';
        spawnParticles(asteroids[i].x + 30, asteroids[i].y + 30, '#00ffff', 15);
        asteroids.splice(i, 1);
        playSound('shield');
      } else {
        takeDamage();
        return;
      }
    }
  }

  // Shields
  for (let i = shields.length - 1; i >= 0; i--) {
    shields[i].x -= shields[i].speed;
    if (shields[i].x < -50) shields.splice(i, 1);
    else if (rectsCollide(cat, shields[i])) {
      hasShield = true;
      shieldTimer = 600;
      shieldEl.style.display = 'block';
      shields.splice(i, 1);
      playSound('shield');
    }
  }

  if (hasShield) {
    shieldTimer--;
    if (shieldTimer <= 0) {
      hasShield = false;
      shieldEl.style.display = 'none';
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (frame % 8 === 0) {
    score += 1;
    scoreEl.textContent = 'Счёт: ' + score;
  }
}

function takeDamage() {
  lives--;
  updateLivesUI();
  playSound('hit');
  spawnParticles(cat.x + 40, cat.y + 40, '#ff00ff', 20);
  if (lives <= 0) {
    gameOver();
  } else {
    cat.y = H / 2;
    cat.vy = 0;
  }
}

function rectsCollide(a, b) {
  const bSize = b.size || 40;
  return a.x < b.x + bSize &&
         a.x + a.width > b.x &&
         a.y < b.y + bSize &&
         a.y + a.height > b.y;
}

function draw() {
  if (bgImg.complete) {
    ctx.drawImage(bgImg, bgX, 0, W, H);
    ctx.drawImage(bgImg, bgX + W, 0, W, H);
  } else {
    ctx.fillStyle = '#0a001a';
    ctx.fillRect(0, 0, W, H);
  }

  particles.forEach(p => {
    ctx.globalAlpha = p.life / 40;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  stars.forEach(s => {
    if (starImg.complete) ctx.drawImage(starImg, s.x, s.y, s.size, s.size);
  });

  shields.forEach(s => {
    ctx.fillStyle = '#00ffff';
    ctx.beginPath();
    ctx.arc(s.x + s.size/2, s.y + s.size/2, s.size/2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.stroke();
  });

  asteroids.forEach(a => {
    if (astImg.complete) ctx.drawImage(astImg, a.x, a.y, a.size, a.size);
  });

  if (hasShield) {
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#00ffff';
  }
  if (catImg.complete) {
    ctx.drawImage(catImg, cat.x, cat.y, cat.width, cat.height);
  } else {
    ctx.fillStyle = '#ff00ff';
    ctx.fillRect(cat.x, cat.y, cat.width, cat.height);
  }
  ctx.shadowBlur = 0;
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  initAudio();
  init();
  gameRunning = true;
  paused = false;
  startScreen.style.display = 'none';
  gameOverScreen.style.display = 'none';
  pauseScreen.style.display = 'none';
  pauseBtn.style.display = 'block';
}

function gameOver() {
  gameRunning = false;
  paused = false;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('cyberCatHigh', highScore);
  }
  finalScoreEl.textContent = 'Счёт: ' + score;
  finalHighEl.textContent = 'Рекорд: ' + highScore;
  highScoreEl.textContent = 'Рекорд: ' + highScore;
  gameOverScreen.style.display = 'flex';
  pauseBtn.style.display = 'none';
}

function jump() {
  if (gameRunning && !paused) {
    cat.vy = cat.jump;
    playSound('jump');
  }
}

function togglePause() {
  if (!gameRunning) return;
  paused = !paused;
  pauseScreen.style.display = paused ? 'flex' : 'none';
}

// Controls
document.getElementById('startBtn').onclick = startGame;
document.getElementById('restartBtn').onclick = startGame;
document.getElementById('resumeBtn').onclick = togglePause;
pauseBtn.onclick = togglePause;

canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });
canvas.addEventListener('click', jump);
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') jump();
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
});

gameLoop();
</script>
</body>
</html>
